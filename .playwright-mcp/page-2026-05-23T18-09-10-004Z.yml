        - paragraph [ref=e75]: Emportez vos programmes favoris avec vous que vous soyez chez vous, à la plage ou en déplacement. Consultez le programme TV, préparez vos soirées TV et programmez vos enregistrements. Vous pouvez aussi télécharger vos VOD pour les retrouver partout, même sans connexion internet. Tout est possible !
