[package]
name = "ui-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
frenchetv-core = { path = "../core" }
eframe = { version = "0.30", features = ["wgpu"] }
egui = "0.30"
egui_extras = { version = "0.30", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# libmpv2 = "3"  # requires libmpv system library; re-enable when libmpv-dev is installed
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
sha1 = { version = "0.10", default-features = false }
serde_json = "1"
backhand = { version = "0.25", default-features = false, features = ["xz", "gzip", "zstd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
quick-xml = "0.36"
base64 = "0.22"
url = { version = "2", features = ["serde"] }

[build-dependencies]
cc = "1"
