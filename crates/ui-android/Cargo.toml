[package]
name = "ui-android"
version.workspace = true
edition.workspace = true

[lib]
name = "ui_android"
crate-type = ["cdylib"]

[dependencies]
frenchetv-core = { path = "../core" }

[target.'cfg(target_os = "android")'.dependencies]
# "glow" (GLES) rather than "wgpu": broader driver compatibility on the cheap
# Android TV boxes / Fire TV Sticks this app targets, some of which have poor
# or no Vulkan support but universal GLES support. `run_native` itself is
# gated behind having a renderer feature enabled at all.
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "android-game-activity", "glow"] }
egui = "0.30"
egui_extras = { version = "0.30", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
android_logger = "0.14"
log = "0.4"
url = "2"
jni = { version = "0.21", default-features = false }
android-activity = { version = "0.6", features = ["game-activity"] }
anyhow = "1"
