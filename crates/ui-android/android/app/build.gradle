plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.frenchetv'
    compileSdk 34

    defaultConfig {
        applicationId "com.frenchetv"
        // Android TV / FireTV minimum
        minSdk 21
        targetSdk 34
        // Play/Amazon Appstore reject a non-incrementing versionCode, so a real
        // release build must override this — see .github/workflows/release.yml,
        // which sets it from the Actions run number (always increasing).
        //
        // Computed into a local first: `versionCode (expr).toInteger()` parses as
        // `(versionCode(expr)).toInteger()` in Groovy (the parenthesized group
        // right after the DSL method name closes its call), not
        // `versionCode((expr).toInteger())` -- silently passing a String where
        // AGP expects an Integer.
        def releaseVersionCode = (System.getenv("FRENCHETV_VERSION_CODE") ?: "1").toInteger()
        versionCode releaseVersionCode
        versionName System.getenv("FRENCHETV_VERSION_NAME") ?: "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // Populated from GitHub Actions secrets at release build time (see
    // .github/workflows/release.yml). Left empty for local/CI-PR builds, which
    // then produce an unsigned release APK/AAB — fine for `assembleDebug` or
    // manual signing, just not directly installable/uploadable as-is.
    def releaseKeystorePath = System.getenv("FRENCHETV_KEYSTORE_PATH")

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("FRENCHETV_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FRENCHETV_KEY_ALIAS")
                keyPassword System.getenv("FRENCHETV_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Rust .so files are placed here by cargo-ndk
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.12.0'

    // Leanback (Android TV UI)
    implementation 'androidx.leanback:leanback:1.0.0'

    // Media3 / ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    // GameActivity (required by android-activity game-activity backend)
    implementation 'androidx.games:games-activity:3.0.3'
}
