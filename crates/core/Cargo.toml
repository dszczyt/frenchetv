[package]
name = "frenchetv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "stream", "gzip", "deflate", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
dirs = "5"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.36"
base64 = "0.22"
flate2 = "1"
bytes = "1"
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
serde_json = "1"
